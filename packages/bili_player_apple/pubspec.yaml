name: bili_player_apple
description: Apple AVPlayer playback backend for BiliSail on iOS.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  bili_player:
    path: ../bili_player

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: BiliPlayerApplePlugin
